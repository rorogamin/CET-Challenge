<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CET (Catch Em Turing)</title>
<script>
(function () {
  var trimmed = location.pathname.replace(/\/+$/, '');
  var base = trimmed.replace(/[^\/]*$/, '');
  var seg = trimmed.split('/').pop() || '';
  try { seg = decodeURIComponent(seg); } catch (e) {}
  location.replace(base + '?m=' + encodeURIComponent(seg));
})();
</script>
</head>
<body></body>
</html>
